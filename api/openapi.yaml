      operationId: devListScheduleRuns
      parameters:
        - {name: task, in: query, schema: {type: string}, description: "Only this task's runs."}
        - {name: status, in: query, schema: {type: string, enum: [running, ok, failed, interrupted]}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
