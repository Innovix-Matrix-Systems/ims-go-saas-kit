  /api/v1/activity:
    parameters:
      - {$ref: "#/components/parameters/ActingTenant"}
      - {$ref: "#/components/parameters/ActingBranch"}
      - {$ref: "#/components/parameters/ActingUser"}
    get:
      tags: [Activity]
      summary: The activity log, newest first
      description: |
        Who did what (user, role, branch, setting and subscription changes).
        Secrets in `changes` are redacted.

        - With `activity.view`, a tenant user reads their own tenant only.
        - With `activity.view.all`, an internal user reads every tenant and the
          system audit log (entries with `tenant_id: null`: internal changes and
          `impersonation.started`, `impersonation.request`, `impersonation.denied`).
          `tenant_id` narrows it to one tenant or to `system`. With X-Acting-Tenant
          they read that tenant only. An internal account without it gets 403.

        `by_staff` is true when staff made the change while acting as the actor.
        Only `activity.view.all` readers get who that was (`impersonator`).
      operationId: listActivity
      parameters:
        - name: tenant_id
          in: query
          required: false
          schema: {type: string}
          description: A tenant id, or `system` for the system audit log only (`activity.view.all` only).
          example: system
        - {name: impersonator_id, in: query, required: false, schema: {type: integer, format: int64}, description: Entries made by this staff member while acting as a user (`activity.view.all` only).}
        - {name: impersonated, in: query, required: false, schema: {type: boolean}, description: Only act-as entries (`activity.view.all` only).}
        - {name: cursor, in: query, required: false, schema: {type: string}, description: Opaque cursor from `meta.next_cursor`.}
        - {name: per_page, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
        - {name: subject_type, in: query, required: false, schema: {type: string}, example: user}
        - {name: subject_id, in: query, required: false, schema: {type: integer, format: int64}}
        - {name: actor_id, in: query, required: false, schema: {type: integer, format: int64}}
        - {name: action, in: query, required: false, schema: {type: string}, example: user.created, description: One action key.}
        - {name: from, in: query, required: false, schema: {type: string, format: date-time}, description: Entries at or after this time.}
        - {name: to, in: query, required: false, schema: {type: string, format: date-time}, description: Entries at or before this time.}
        - {name: search, in: query, required: false, schema: {type: string}, description: "Matches the action, subject type, IP, actor name and the changes."}
      responses:
        "200":
          description: One page of activity.
          content:
            application/json:
