    parameters:
      - {$ref: "#/components/parameters/ActingTenant"}
      - {$ref: "#/components/parameters/ActingBranch"}
      - {$ref: "#/components/parameters/ActingUser"}
      - {$ref: "#/components/parameters/IdempotencyKey"}
    post:
      tags: [Billing]
      summary: Subscribe the resolved tenant to a package
      description: >-
        Idempotent per tenant + package + payment method: while a checkout is still pending, calling
        again returns that same subscription and payment instead of charging twice.
      operationId: billingSubscribe
      requestBody:
