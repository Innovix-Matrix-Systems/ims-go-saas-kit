  /api/v1/internal/activity/export:
    post:
      tags: [Activity]
      summary: Export the platform activity log as a background job
      description: "Staff (activity.view.all): every organization and the system log, narrowed by tenant_id. On the internal routes because staff without acting headers may not write through the tenant routes."
      operationId: exportPlatformActivity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tenant_id: {type: string, description: "Staff only: a tenant id, or system. Empty: every organization and the system log."}
                subject_type: {type: string}
                actor_id: {type: integer, format: int64}
                action: {type: string}
                from: {type: string, format: date-time}
                to: {type: string, format: date-time}
                search: {type: string}
      responses:
        "202":
          description: The queued export job.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: "#/components/schemas/ProcessingJob"}
        "401": *unauthorized
        "403": *forbidden
        "422": *validationFailed
        "503": *serviceUnavailable

  /api/v1/internal/notification/broadcast:
    post:
      tags: [Notifications]
      summary: Send an announcement to organizations
      description: "Creates one platform.announcement notification per organization (every notification belongs to one; GLOBAL targets reach platform staff only), addressed to all its members. Without tenant_ids it reaches every active organization."
      operationId: broadcastNotification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [priority, title]
