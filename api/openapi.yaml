openapi: 3.0.3

info:
  title: IMS Go Admin Starter
  version: 1.0.0
  description: |
    Canonical HTTP contract for the IMS Go Admin Starter. It is the source of
    truth for the API surface: success envelopes, pagination, the
    RFC 9457 `application/problem+json` error model, and the bearer security scheme.

    ## Conventions
    - Success responses are wrapped: `{"data": ...}` for resources, `{"message": ...}` for
      message-only results, and `204 No Content` (empty body) for deletions/logout.
    - List endpoints return `{"data": [...], "links": {...}, "meta": {...}}`.
    - Every error is `application/problem+json` (RFC 9457) carrying `type`, `title`,
      `status`, `detail`, `error_code`, `timestamp`; `trace_id` (5xx), `errors` (422),
      `meta` (feature limits) and `retry_after` (429) appear when applicable.
    - Timestamps are RFC 3339 UTC. Money is in minor units (paisa), currency `BDT`.
    - IDs are 64-bit integers.

    ## Tenancy & impersonation
    Authenticated routes are resolved to a tenant/branch from the caller's identity.
    Impersonators may send the optional headers `X-Acting-Tenant` and `X-Acting-Branch`;
    sends on tenant-resolved write routes without acting headers are rejected with 403.
    Request locale is negotiated from `Accept-Language` (`en`, `bn`).

servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: System
    description: Service metadata and transport demo endpoints.
  - name: Auth
    description: Login, OTP verification and logout.
  - name: Users
    description: Tenant users, profiles and background import/export.
  - name: Privacy
    description: |
      Account deletion and personal-data export (right to erasure, right of access). An
      erased user keeps a tombstone row; every module's data about them is deleted or
      anonymized. Design: docs/design/account-deletion-and-export.md.
  - name: Branches
  - name: Activity
    description: Tenant activity log (who did what).
  - name: Roles & Permissions
  - name: Tenants
  - name: Onboarding
    description: Self-service organization sign-up and the new organization's first-run setup.
  - name: Billing
    description: Packages, subscriptions, payments and manual approvals.
  - name: Notifications
  - name: Webhooks
  - name: Files
  - name: Data Processing
  - name: Settings
    description: Grouped settings with global and tenant targets.
  - name: Feature Flags
    description: Boolean feature flags with global, tenant and user targets.
  - name: Dev
    description: Developer dashboard identity and (later) telemetry/queue admin API.
  - name: Ops
    description: Liveness, health, docs and metrics.
  - name: MCP
    description: |
      The MCP server AI agents connect to as a connector (`/mcp`), the OAuth 2.1
      authorization server that signs them in, the user's connections and the
      clients an admin registers by hand. Mounted when `MCP_ENABLED`; otherwise 404.
      An operation marked `x-mcp` is also an MCP tool (see docs/guides/mcp.md).

security:
  - bearerAuth: []

# Shared response objects, aliased throughout `paths`. Kept here (before use)
# because YAML aliases must reference an anchor defined earlier in the document.
x-shared-responses:
  badRequest: &badRequest
    description: Malformed request.
    content:
      application/problem+json:
        schema: {$ref: "#/components/schemas/Problem"}
  unauthorized: &unauthorized
    description: Missing, invalid or expired bearer token.
    content:
      application/problem+json:
        schema: {$ref: "#/components/schemas/Problem"}
  forbidden: &forbidden
    description: Authenticated but not permitted, or tenant context missing.
    content:
      application/problem+json:
        schema: {$ref: "#/components/schemas/Problem"}
  notFound: &notFound
    description: Resource not found.
    content:
      application/problem+json:
        schema: {$ref: "#/components/schemas/Problem"}
  paymentRequired: &paymentRequired
    description: Feature not available or usage limit exceeded for the plan.
    content:
      application/problem+json:
        schema: {$ref: "#/components/schemas/Problem"}
  conflict: &conflict
    description: Conflicting state.
    content:
      application/problem+json:
        schema: {$ref: "#/components/schemas/Problem"}
  validationFailed: &validationFailed
    description: Validation failed; `errors` carries field messages.
    content:
      application/problem+json:
        schema: {$ref: "#/components/schemas/Problem"}
  requestTooLarge: &requestTooLarge
    description: Payload exceeds the configured limit.
    content:
      application/problem+json:
        schema: {$ref: "#/components/schemas/Problem"}
  unsupportedMedia: &unsupportedMedia
    description: Unsupported request content type.
    content:
      application/problem+json:
        schema: {$ref: "#/components/schemas/Problem"}
  tooManyRequests: &tooManyRequests
    description: Rate limit exceeded; see `retry_after`.
    headers:
      Retry-After:
        schema: {type: integer}
    content:
      application/problem+json:
        schema: {$ref: "#/components/schemas/Problem"}
  serviceUnavailable: &serviceUnavailable
    description: A dependency or gateway is unavailable.
    content:
      application/problem+json:
        schema: {$ref: "#/components/schemas/Problem"}
  internalError: &internalError
    description: Unexpected error; the response carries a `trace_id`.
    content:
      application/problem+json:
        schema: {$ref: "#/components/schemas/Problem"}

paths:
  /up:
    get:
      tags: [Ops]
      summary: Liveness probe
      operationId: liveness
      security: []
      responses:
        "200":
          description: Process is up.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {type: string, example: ok}

  /api/health:
    get:
      tags: [Ops]
      summary: Health checks
      operationId: health
      security: []
      parameters:
        - name: fresh
          in: query
          description: Run checks live instead of returning the cached result.
          schema: {type: string, enum: ["1"]}
      responses:
        "200":
          description: Health results (cached up to the configured TTL).
          headers:
            Cache-Control:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HealthResults"}

  /docs:
    get:
      tags: [Ops]
      summary: Scalar API reference UI (config-gated)
      operationId: docsUI
      security: []
      responses:
        "200":
          description: HTML documentation page.
          content:
            text/html:
              schema: {type: string}
        "404": *notFound

  /docs/openapi.yaml:
    get:
      tags: [Ops]
      summary: Raw OpenAPI document (config-gated)
      operationId: docsSpec
      security: []
      responses:
        "200":
          description: The embedded OpenAPI specification.
          content:
            application/yaml:
              schema: {type: string}
        "404": *notFound

  /metrics:
    get:
      tags: [Ops]
      summary: Prometheus metrics (config-gated)
      operationId: metrics
      security: []
      responses:
        "200":
          description: Prometheus exposition format.
          content:
            text/plain:
              schema: {type: string}
        "404": *notFound

  /api/v1/system/info:
    parameters:
      - {$ref: "#/components/parameters/ActingTenant"}
      - {$ref: "#/components/parameters/ActingBranch"}
    get:
      tags: [System]
      summary: Service information
      operationId: systemInfo
      security: []
      responses:
        "200":
          description: Build/runtime information.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SystemInfoEnvelope"}

  /api/v1/system/echo:
    parameters:
      - {$ref: "#/components/parameters/ActingTenant"}
      - {$ref: "#/components/parameters/ActingBranch"}
    post:
      tags: [System]
      summary: Echo a message (validation demo)
      operationId: systemEcho
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: {type: string, minLength: 2, maxLength: 255}
      responses:
        "200":
          description: The trimmed message and its length.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EchoEnvelope"}
        "422": *validationFailed

  /api/v1/login:
    parameters:
      - {$ref: "#/components/parameters/ActingTenant"}
      - {$ref: "#/components/parameters/ActingBranch"}
    post:
      tags: [Auth]
      summary: Authenticate with email and password
      operationId: authLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LoginRequest"}
      responses:
        "200":
          description: |
            `status` is `AUTH_SUCCESS` with a `token`; `OTP_REQUIRED` with a null token when a
            second factor is needed (`method`: `totp` for an authenticator app, `email` for a
            mailed code; finish with `POST /api/v1/verify-otp`); or `TWO_FACTOR_SETUP_REQUIRED`
            with a setup-only token when the account must turn two-factor on first.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LoginEnvelope"}
        "401": *unauthorized
        "422": *validationFailed
        "429": *tooManyRequests

  /api/v1/verify-otp:
    parameters:
      - {$ref: "#/components/parameters/ActingTenant"}
      - {$ref: "#/components/parameters/ActingBranch"}
    post:
      tags: [Auth]
      summary: Complete login by verifying an OTP
      operationId: authVerifyOTP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/VerifyOTPRequest"}
      responses:
        "200":
          description: Login result with an issued token.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LoginEnvelope"}
        "401": *unauthorized
        "422": *validationFailed
        "429": *tooManyRequests

  /api/v1/social/providers:
    get:
      tags: [Auth]
      summary: List the enabled social login providers
      description: >-
        The providers SOCIAL_PROVIDERS enables, in display order, for the login screen. Empty when
        social login is off.
      operationId: authSocialProviders
      security: []
      responses:
        "200":
          description: The enabled providers.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SocialProviderListEnvelope"}

  /api/v1/social/{provider}/login:
    post:
      tags: [Auth]
      summary: Sign in with a social provider
      description: >-
        The client signs in at the provider and sends what it got: an `id_token` for Google, the
        authorization `code` (with its `code_verifier` and `redirect_uri`) for GitHub. The API
        verifies it with the provider, finds the user with that verified e-mail address and answers
        like `POST /login`, always with a token (no OTP step). Refused with 403
        `ACCOUNT_UNVERIFIED` when the provider has not verified the address, 403
        `SOCIAL_ACCOUNT_NOT_FOUND` when no user has it, and 404 for a provider that is not enabled.
      operationId: authSocialLogin
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema: {type: string, example: google}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SocialLoginRequest"}
      responses:
        "200":
          description: Login result with an issued token.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LoginEnvelope"}
        "401": *unauthorized
        "403": *forbidden
        "404": *notFound
        "422": *validationFailed
        "429": *tooManyRequests
        "503": *serviceUnavailable

  /api/v1/forgot-password:
    post:
      tags: [Auth]
      summary: Send a password reset link
      description: >-
        Always answers 200 with the same message, whether or not the e-mail belongs to an account
        (no account enumeration). At most one mail per address per minute.
      operationId: authForgotPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: {type: string, format: email, maxLength: 255}
      responses:
        "200":
          description: Accepted.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MessageEnvelope"}
        "422": *validationFailed
        "429": *tooManyRequests

  /api/v1/signup:
    post:
      tags: [Onboarding]
      summary: Create an organization and its owner (self-service sign-up)
      description: >-
        Creates the organization (with its default branch and roles), starts it on the sign-up
        package (setting `signup.package_id`, or the first active free package) and creates the
        caller as its owner: an Admin who must confirm the e-mail address before signing in.
        Always answers 202 with the same message when the request is valid, whether or not the
        address already has an account (that owner is mailed instead): sign-up never reveals
        which addresses exist. Records the accepted terms and privacy policy version. Ten
        attempts per IP address an hour.
      operationId: signUp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, organization_name, accept_terms]
              properties:
                name: {type: string, minLength: 2, maxLength: 255}
                email: {type: string, format: email, maxLength: 255}
                password: {type: string, minLength: 8, maxLength: 72}
                organization_name: {type: string, minLength: 2, maxLength: 100}
                phone: {type: string, maxLength: 50, nullable: true}
                locale: {type: string, enum: [en, bn]}
                accept_terms:
                  type: boolean
                  description: Must be true (terms of service and privacy policy).
      responses:
        "202":
          description: Accepted; the next step is in the caller's mailbox.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [message]
                    properties:
                      message: {type: string}
        "403": *forbidden
        "422": *validationFailed
        "429": *tooManyRequests
        "503": *serviceUnavailable

  /api/v1/onboarding:
    parameters:
      - {$ref: "#/components/parameters/ActingTenant"}
      - {$ref: "#/components/parameters/ActingBranch"}
      - {$ref: "#/components/parameters/ActingUser"}
    get:
      tags: [Onboarding]
      summary: Get the organization's first-run setup progress
      description: Any member may read it; `is_owner` says whether the caller finishes it.
      operationId: getOnboarding
      responses:
        "200":
          description: The setup progress.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OnboardingEnvelope"}
        "401": *unauthorized
        "403": *forbidden
        "404": *notFound

  /api/v1/onboarding/complete:
    parameters:
      - {$ref: "#/components/parameters/ActingTenant"}
      - {$ref: "#/components/parameters/ActingBranch"}
    post:
      tags: [Onboarding]
      summary: Finish the organization's first-run setup
      description: Only the owner, and not while someone acts as them. Repeating it keeps the first completion time.
      operationId: completeOnboarding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                skipped_steps:
                  type: array
                  maxItems: 10
                  items: {type: string, enum: [organization, package, invite, two_factor]}
      responses:
        "200":
          description: The completed setup.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OnboardingEnvelope"}
        "401": *unauthorized
        "403": *forbidden
        "404": *notFound
        "422": *validationFailed

  /api/v1/organization:
    parameters:
      - {$ref: "#/components/parameters/ActingTenant"}
      - {$ref: "#/components/parameters/ActingBranch"}
      - {$ref: "#/components/parameters/ActingUser"}
    get:
      tags: [Tenants]
      summary: Get the caller's organization
      description: Any member. `is_owner` tells whether the caller owns it.
      operationId: getOrganization
      responses:
        "200":
          description: The organization.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OrganizationEnvelope"}
        "401": *unauthorized
        "403": *forbidden
    patch:
      tags: [Tenants]
      summary: Update the caller's organization
      description: Name and contact details (`organization.update`). Code, slug, domain and status stay with platform staff.
      operationId: updateOrganization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, minLength: 2, maxLength: 255}
                phone: {type: string, maxLength: 50, nullable: true}
                email: {type: string, format: email, maxLength: 255, nullable: true}
      responses:
        "200":
          description: The updated organization.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OrganizationEnvelope"}
        "401": *unauthorized
        "403": *forbidden
        "422": *validationFailed

  /api/v1/organization/transfer-ownership:
    parameters:
      - {$ref: "#/components/parameters/ActingTenant"}
      - {$ref: "#/components/parameters/ActingBranch"}
    post:
      tags: [Tenants]
      summary: Transfer the organization's ownership
      description: >-
        Only the current owner, with their password, and never while acting as another user. The
        new owner must be an active member who can manage the organization (`organization.update`).
        The owner cannot be removed, deactivated, demoted, have their password or two-factor reset
        by others, or be erased, until ownership is transferred.
      operationId: transferOrganizationOwnership
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, password]
              properties:
                user_id: {type: integer, format: int64}
                password: {type: string, maxLength: 72}
      responses:
        "200":
          description: The organization with its new owner.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OrganizationEnvelope"}
        "401": *unauthorized
        "403": *forbidden
        "422": *validationFailed

  /api/v1/reset-password:
    post:
      tags: [Auth]
      summary: Set a new password with a reset token
      description: The token works once. Every session of the account is signed out.
      operationId: authResetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, token, password, password_confirmation]
              properties:
                email: {type: string, format: email, maxLength: 255}
                token: {type: string, maxLength: 200}
                password: {type: string, minLength: 8, maxLength: 72}
                password_confirmation: {type: string}
      responses:
        "200":
          description: Password changed.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MessageEnvelope"}
        "422": *validationFailed
        "429": *tooManyRequests

  /api/v1/email/verification-notification:
    post:
      tags: [Auth]
      summary: Send (again) the e-mail verification link
      description: Same answer for every address (no enumeration); at most one mail per address per minute.
      operationId: authResendVerification
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: {type: string, format: email, maxLength: 255}
      responses:
        "200":
          description: Accepted.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MessageEnvelope"}
        "422": *validationFailed
        "429": *tooManyRequests

  /api/v1/invitation/preview:
    post:
      tags: [Auth]
      summary: Describe a pending invitation
      description: >-
        For the invitation page: the invitee's name and e-mail, the organization and who invited
        them. Does not use the link up. Answers 422 for a wrong e-mail or an unknown or expired
        link, and 404 once the invitation was accepted.
      operationId: authPreviewInvitation
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, token]
              properties:
                email: {type: string, format: email, maxLength: 255}
                token: {type: string, maxLength: 200}
      responses:
        "200":
          description: The invitation.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [name, email, organization_name, inviter_name]
                    properties:
                      name: {type: string}
                      email: {type: string}
                      organization_name: {type: string}
                      inviter_name: {type: string}
        "404": *notFound
        "422": *validationFailed
        "429": *tooManyRequests

  /api/v1/email/change/confirm:
    post:
      tags: [Auth]
      summary: Confirm a new e-mail address
      description: >-
        Opens the link mailed to the new address: the account switches to it (verified), the old
        address is told, and every session is signed out. The link works once.
      operationId: authConfirmEmailChange
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: {type: string, maxLength: 200}
      responses:
        "200":
          description: Changed.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MessageEnvelope"}
        "422": *validationFailed
        "429": *tooManyRequests

  /api/v1/user/profile/change-email:
    post:
      tags: [Users]
      summary: Change the authenticated user's e-mail address
      description: >-
        Checks the password and mails a confirmation link (`AUTH_EMAIL_CHANGE_URL`) to the new
        address; nothing changes until it is opened. One request a minute. Refused while acting as
        another user.
      operationId: requestEmailChange
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, email]
              properties:
                password: {type: string, maxLength: 72}
                email: {type: string, format: email, maxLength: 255}
      responses:
        "202":
          description: The confirmation link is on its way.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MessageEnvelope"}
        "401": *unauthorized
        "403": *forbidden
        "422": *validationFailed
        "429": *tooManyRequests

  /api/v1/invitation/accept:
    post:
      tags: [Auth]
      summary: Accept an invitation by choosing a password
      description: |
        With the token from the invitation link. The account becomes active and its e-mail
        verified; then sign in with `POST /api/v1/login`. The link works once, and only while the
        invitation is pending.
      operationId: authAcceptInvitation
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, token, password, password_confirmation]
              properties:
                email: {type: string, format: email, maxLength: 255}
                token: {type: string, maxLength: 200}
                password: {type: string, minLength: 8, maxLength: 72}
                password_confirmation: {type: string}
      responses:
        "200":
          description: The account is ready.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MessageEnvelope"}
        "422": *validationFailed
        "429": *tooManyRequests

  /api/v1/email/verify:
    post:
      tags: [Auth]
      summary: Verify an e-mail address with the token from the verification link
      operationId: authVerifyEmail
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: {type: string, maxLength: 200}
      responses:
        "200":
          description: Verified.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MessageEnvelope"}
        "422": *validationFailed
        "429": *tooManyRequests

  /api/v1/logout:
    parameters:
      - {$ref: "#/components/parameters/ActingTenant"}
      - {$ref: "#/components/parameters/ActingBranch"}
    post:
      tags: [Auth]
      summary: Revoke the token for one device
      operationId: authLogout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device]
              properties:
                device: {type: string, maxLength: 100}
      responses:
        "204": {description: Token revoked.}
        "401": *unauthorized
        "422": *validationFailed

  /api/v1/two-factor:
    get:
      tags: [Auth]
      summary: The caller's two-factor state
      operationId: twoFactorStatus
      responses:
        "200":
          description: The state, and whether the account must have two-factor.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: "#/components/schemas/TwoFactorStatus"}
        "401": *unauthorized
    post:
      tags: [Auth]
      summary: Start turning two-factor on
      description: |
        `totp` returns the secret and an `otpauth://` URL (render it as a QR code for the
        authenticator app); `email` mails a code to the caller's verified address. Finish with
        `POST /api/v1/two-factor/confirm`. Needs the caller's password. Starting again replaces an
        unconfirmed enrolment; when two-factor is already on it answers 409.
      operationId: twoFactorStart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method, password]
              properties:
                method: {type: string, enum: [totp, email]}
                password: {type: string, maxLength: 72}
      responses:
        "200":
          description: The enrolment.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: "#/components/schemas/TwoFactorSetup"}
        "401": *unauthorized
        "409": *conflict
        "422": *validationFailed
        "429": *tooManyRequests
    delete:
      tags: [Auth]
      summary: Turn two-factor off
      description: Needs the caller's password. Signs the caller's other sessions out and mails a notice.
      operationId: twoFactorDisable
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PasswordConfirmation"}
      responses:
        "204": {description: Two-factor is off.}
        "401": *unauthorized
        "409": *conflict
        "422": *validationFailed
        "429": *tooManyRequests

  /api/v1/two-factor/confirm:
    post:
      tags: [Auth]
      summary: Finish turning two-factor on
      description: |
        With a code from the authenticator app (`totp`) or the mail (`email`). Returns eight
        recovery codes, shown once: each signs in once when the phone or mailbox is lost. A
        caller signed in with a setup-only token also gets a full `token` that replaces it.
      operationId: twoFactorConfirm
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: {type: string, maxLength: 20}
      responses:
        "200":
          description: Recovery codes (and a full token after a setup-only sign-in).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: "#/components/schemas/TwoFactorRecoveryCodes"}
        "400": *badRequest
        "401": *unauthorized
        "409": *conflict
        "422": *validationFailed

  /api/v1/two-factor/recovery-codes:
    post:
      tags: [Auth]
      summary: Replace the recovery codes
      description: Needs the caller's password. The old codes stop working.
      operationId: twoFactorRecoveryCodes
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PasswordConfirmation"}
      responses:
        "200":
          description: The new recovery codes, shown once.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: "#/components/schemas/TwoFactorRecoveryCodes"}
        "401": *unauthorized
        "409": *conflict
        "422": *validationFailed
        "429": *tooManyRequests

  /api/v1/sessions:
    get:
      tags: [Auth]
      summary: The caller's own sessions
      description: |
        Every device the caller is signed in on (session tokens; MCP connections are under
        `/api/v1/user/connections`), most recently used first. The session making the request has
        `current: true`.
      operationId: authListSessions
      responses:
        "200":
          description: The sessions.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: {$ref: "#/components/schemas/Session"}
        "401": *unauthorized

  /api/v1/sessions/revoke-others:
    post:
      tags: [Auth]
      summary: Sign out every other session
      description: |
        Keeps the session making the request and signs out every other one. Like a password
        change, it also disconnects the caller's MCP connections. Recorded as
        `auth.session_revoked` in the activity log.
      operationId: authRevokeOtherSessions
      responses:
        "204": {description: Other sessions signed out.}
        "401": *unauthorized

  /api/v1/sessions/{id}:
    delete:
      tags: [Auth]
      summary: Sign out one session
      description: Only the caller's own sessions; any other id answers 404. Recorded as `auth.session_revoked`.
      operationId: authRevokeSession
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
      responses:
        "204": {description: Session signed out.}
        "401": *unauthorized
        "404": *notFound

  /mcp:
    post:
      tags: [MCP]
      summary: MCP endpoint (Streamable HTTP, stateless)
      description: |
        JSON-RPC over HTTP for MCP clients. Takes an MCP access token from the
        OAuth flow below, never a session token. Without one it answers 401 with
        `WWW-Authenticate: Bearer resource_metadata="…"`; a write tool called
        with a read-only token answers 403 `insufficient_scope`.
      operationId: mcpCall
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, description: A JSON-RPC 2.0 message or batch.}
      responses:
        "200":
          description: The JSON-RPC response.
          content:
            application/json:
              schema: {type: object}
        "401": {description: No valid MCP access token.}
        "403": {description: "Insufficient scope, or a disallowed Origin."}
        "404": *notFound
        "429": *tooManyRequests
    get:
      tags: [MCP]
      summary: Not used (stateless server)
      operationId: mcpStream
      security: []
      responses:
        "404": *notFound
        "405": {description: The server is stateless and keeps no stream.}
    delete:
      tags: [MCP]
      summary: Not used (stateless server)
      operationId: mcpEndSession
      security: []
      responses:
        "404": *notFound
        "405": {description: The server is stateless and has no session.}

  /.well-known/oauth-protected-resource:
    get:
      tags: [MCP]
      summary: Protected resource metadata for /mcp (RFC 9728)
      operationId: oauthProtectedResource
      security: []
      responses:
        "200":
          description: Which authorization server issues tokens for /mcp.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProtectedResourceMetadata"}
        "404": *notFound

  /.well-known/oauth-protected-resource/mcp:
    get:
      tags: [MCP]
      summary: Protected resource metadata for /mcp, path form (RFC 9728)
      operationId: oauthProtectedResourceMCP
      security: []
      responses:
        "200":
          description: Which authorization server issues tokens for /mcp.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProtectedResourceMetadata"}
        "404": *notFound

  /.well-known/oauth-authorization-server:
    get:
      tags: [MCP]
      summary: Authorization server metadata (RFC 8414)
      operationId: oauthServerMetadata
      security: []
      responses:
        "200":
          description: Endpoints and capabilities, including Client ID Metadata Document support.
          content:
            application/json:
              schema: {type: object}
        "404": *notFound

  /oauth/authorize:
    get:
      tags: [MCP]
      summary: Start authorization (sign-in page)
      description: |
        Authorization code with PKCE S256. `client_id` is an https URL (a Client ID
        Metadata Document: no registration) or a registered client's id. A bad
        client or redirect URI shows an error page and never redirects.
      operationId: oauthAuthorize
      security: []
      parameters:
        - {name: client_id, in: query, required: true, schema: {type: string}}
        - {name: redirect_uri, in: query, schema: {type: string}}
        - {name: response_type, in: query, required: true, schema: {type: string, enum: [code]}}
        - {name: code_challenge, in: query, required: true, schema: {type: string}}
        - {name: code_challenge_method, in: query, required: true, schema: {type: string, enum: [S256]}}
        - {name: state, in: query, schema: {type: string}}
        - {name: scope, in: query, schema: {type: string, example: "mcp:read mcp:write"}}
        - {name: resource, in: query, schema: {type: string}}
      responses:
        "200":
          description: The sign-in page.
          content:
            text/html:
              schema: {type: string}
        "302": {description: "Back to the client with an error (invalid scope, missing PKCE)."}
        "400":
          description: The client or redirect URI is not acceptable (error page).
          content:
            text/html:
              schema: {type: string}
        "404": *notFound

  /oauth/authorize/login:
    post:
      tags: [MCP]
      summary: Sign-in form (password, then OTP when required)
      operationId: oauthAuthorizeLogin
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [csrf]
              properties:
                csrf: {type: string}
                email: {type: string}
                password: {type: string}
                code: {type: string, description: The OTP on the second step.}
      responses:
        "200":
          description: The OTP or consent page.
          content:
            text/html:
              schema: {type: string}
        "401":
          description: The sign-in page again, with the problem.
          content:
            text/html:
              schema: {type: string}
        "404": *notFound

  /oauth/authorize/consent:
    post:
      tags: [MCP]
      summary: Consent form (Allow or Deny)
      operationId: oauthAuthorizeConsent
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [csrf, decision]
              properties:
                csrf: {type: string}
                decision: {type: string, enum: [allow, deny]}
                allow_write: {type: string, enum: ["1"]}
                tenant_id: {type: integer, format: int64, description: "Platform accounts only; 0 means no tenant."}
      responses:
        "302": {description: "Back to the client with code, state and iss, or error=access_denied."}
        "400":
          description: The sign-in expired or the form is not valid (error page).
          content:
            text/html:
              schema: {type: string}
        "404": *notFound

  /oauth/token:
    post:
      tags: [MCP]
      summary: Token endpoint (authorization_code, refresh_token)
      description: |
        Public clients send `client_id`; confidential registered clients
        authenticate with HTTP Basic or `client_secret`. Refresh tokens rotate on
        every use; a reused one revokes the connection.
      operationId: oauthToken
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type]
              properties:
                grant_type: {type: string, enum: [authorization_code, refresh_token]}
                code: {type: string}
                redirect_uri: {type: string}
                code_verifier: {type: string}
                refresh_token: {type: string}
                resource: {type: string}
                client_id: {type: string}
                client_secret: {type: string}
      responses:
        "200":
          description: Tokens.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OAuthTokenResponse"}
        "400":
          description: An OAuth error (invalid_grant, invalid_request and so on).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OAuthError"}
        "401":
          description: invalid_client.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OAuthError"}
        "404": *notFound

  /oauth/revoke:
    post:
      tags: [MCP]
      summary: Token revocation (RFC 7009)
      operationId: oauthRevoke
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [token]
              properties:
                token: {type: string}
                client_id: {type: string}
                client_secret: {type: string}
      responses:
        "200": {description: "Revoked (also for unknown tokens)."}
        "401":
          description: invalid_client.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OAuthError"}
        "404": *notFound

  /api/v1/user/connections:
    get:
      tags: [MCP]
      summary: List my MCP connections
      operationId: listMyConnections
      responses:
        "200":
          description: The caller's connections in force.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: {$ref: "#/components/schemas/MCPConnection"}
        "401": *unauthorized

  /api/v1/user/connections/{id}:
    parameters:
      - $ref: "#/components/parameters/PathID"
    delete:
      tags: [MCP]
      summary: Disconnect one of my MCP connections
      operationId: deleteMyConnection
      responses:
        "204": {description: "Disconnected; the agent loses access."}
        "401": *unauthorized
        "404": *notFound

  /api/v1/oauth-client:
    get:
      tags: [MCP]
      summary: List registered OAuth clients
      operationId: listOAuthClients
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - $ref: "#/components/parameters/Search"
      responses:
        "200":
          description: Paginated clients.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OAuthClientPageEnvelope"}
        "401": *unauthorized
        "403": *forbidden
    post:
      tags: [MCP]
      summary: Register an OAuth client
      description: A confidential client's `client_secret` is in this response only.
      operationId: createOAuthClient
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/OAuthClientRequest"}
      responses:
        "201":
          description: The registered client.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OAuthClientEnvelope"}
        "401": *unauthorized
        "403": *forbidden
        "422": *validationFailed

  /api/v1/oauth-client/{id}:
    parameters:
      - $ref: "#/components/parameters/PathID"
    get:
      tags: [MCP]
      summary: Get a registered OAuth client
      operationId: getOAuthClient
      responses:
        "200":
          description: The client.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OAuthClientEnvelope"}
        "401": *unauthorized
        "403": *forbidden
        "404": *notFound
    put:
      tags: [MCP]
      summary: Update a registered OAuth client
      description: Deactivating it revokes every connection made with it.
      operationId: updateOAuthClient
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/OAuthClientRequest"}
      responses:
        "200":
          description: The client.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OAuthClientEnvelope"}
        "401": *unauthorized
        "403": *forbidden
        "404": *notFound
        "422": *validationFailed
    delete:
      tags: [MCP]
      summary: Delete a registered OAuth client
      description: Revokes every connection made with it.
      operationId: deleteOAuthClient
      responses:
        "204": {description: Deleted.}
        "401": *unauthorized
        "403": *forbidden
        "404": *notFound

  /api/v1/oauth-client/{id}/rotate-secret:
    parameters:
      - $ref: "#/components/parameters/PathID"
    post:
      tags: [MCP]
      summary: Rotate a confidential client's secret
      description: The old secret keeps working for `MCP_OAUTH_SECRET_GRACE`.
      operationId: rotateOAuthClientSecret
      responses:
        "200":
          description: The client with its new `client_secret` (shown once).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OAuthClientEnvelope"}
        "401": *unauthorized
        "403": *forbidden
        "404": *notFound
        "409": *conflict

  /api/v1/user:
    parameters:
      - {$ref: "#/components/parameters/ActingTenant"}
      - {$ref: "#/components/parameters/ActingBranch"}
      - {$ref: "#/components/parameters/ActingUser"}
    get:
      tags: [Users]
      summary: List users
      operationId: listUsers
      x-mcp: {tool: list_users}
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - {name: platform, in: query, required: false, schema: {type: boolean}, description: "Staff accounts only (no tenant). Only a global reader (staff without acting headers) sees any."}
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/OrderByUser"
        - $ref: "#/components/parameters/OrderDirection"
        - {name: invitation, in: query, schema: {type: string, enum: [pending, accepted]}, description: Only invited users who have not (or have) set their password.}
      responses:
        "200":
          description: Paginated users.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UserPageEnvelope"}
        "401": *unauthorized
        "403": *forbidden
        "429": *tooManyRequests
        "500": *internalError
    post:
      tags: [Users]
      summary: Create a user in the resolved tenant
      operationId: createUser
      x-mcp: {tool: create_user}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UserUpsertRequest"}
      responses:
        "201":
          description: Created user.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UserEnvelope"}
        "401": *unauthorized
        "403": *forbidden
        "402": *paymentRequired
        "422": *validationFailed
        "429": *tooManyRequests

  /api/v1/user/profile:
    parameters:
      - {$ref: "#/components/parameters/ActingTenant"}
      - {$ref: "#/components/parameters/ActingBranch"}
      - {$ref: "#/components/parameters/ActingUser"}
    get:
      tags: [Users]
      summary: Get the authenticated user's profile
      operationId: getUserProfile
      x-mcp: {tool: whoami, title: Who am I, description: "The signed-in user: name, e-mail, tenant, branch and roles. Call it first."}
      responses:
        "200":
          description: The caller's user record.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UserEnvelope"}
        "401": *unauthorized

  /api/v1/user/profile/permissions:
    parameters:
      - {$ref: "#/components/parameters/ActingTenant"}
      - {$ref: "#/components/parameters/ActingBranch"}
      - {$ref: "#/components/parameters/ActingUser"}
    get:
      tags: [Users]
      summary: What the signed-in user may do
      description: "The effective user's permissions: the target's when staff act as a user (X-Acting-User), unlike GET /permission/user, which is tenant-exempt and refuses that header."
      operationId: getProfilePermissions
      responses:
        "200":
          description: The permissions.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [super_admin, permissions, acting_as]
                    properties:
                      super_admin: {type: boolean, description: Bypasses every permission check.}
                      permissions: {type: array, items: {type: string}}
                      acting_as: {type: boolean, description: True while staff act as this user.}
        "401": *unauthorized

  /api/v1/user/profile/update:
    parameters:
      - {$ref: "#/components/parameters/ActingTenant"}
      - {$ref: "#/components/parameters/ActingBranch"}
      - {$ref: "#/components/parameters/ActingUser"}
    post:
      tags: [Users]
      summary: Update the authenticated user's profile
      operationId: updateUserProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name: {type: string, maxLength: 100, nullable: true}
                last_name: {type: string, maxLength: 100, nullable: true}
                name: {type: string, minLength: 2, maxLength: 255, nullable: true}
                phone: {type: string, maxLength: 50, nullable: true}
                locale:
                  type: string
                  maxLength: 10
                  description: The user's language ("en", "bn"). An empty string clears it; leave it out to keep it.
      responses:
        "200":
          description: Updated profile.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UserEnvelope"}
        "401": *unauthorized
        "422": *validationFailed

  /api/v1/user/profile/update-avatar:
    parameters:
      - {$ref: "#/components/parameters/ActingTenant"}
      - {$ref: "#/components/parameters/ActingBranch"}
      - {$ref: "#/components/parameters/ActingUser"}
    post:
      tags: [Users]
      summary: Update a user's avatar
      description: |
        Multipart upload that replaces the avatar of the user identified by the
        required `id` form field. Updating your own avatar needs no extra
        permission; updating another user requires `user.update`.
      operationId: updateUserAvatar
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [id, avatar]
              properties:
                id:
                  type: integer
                  format: int64
                  minimum: 1
                  description: User ID whose avatar to update.
                  example: 1
                avatar:
                  type: string
                  format: binary
                  description: Avatar image (max 5MB).
      responses:
        "200":
          description: Updated profile.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UserEnvelope"}
        "401": *unauthorized
        "403": *forbidden
        "404": *notFound
        "415": *unsupportedMedia
        "422": *validationFailed

  /api/v1/user/profile/change-password:
    parameters:
      - {$ref: "#/components/parameters/ActingTenant"}
      - {$ref: "#/components/parameters/ActingBranch"}
      - {$ref: "#/components/parameters/ActingUser"}
    post:
      tags: [Users]
      summary: Change the authenticated user's password
      operationId: changeUserProfilePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, password]
              properties:
                current_password: {type: string}
                password: {type: string, minLength: 8, maxLength: 72}
      responses:
        "200":
          description: Password changed.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MessageEnvelope"}
        "401": *unauthorized
        "422": *validationFailed

  /api/v1/user/assign-role:
    parameters:
      - {$ref: "#/components/parameters/ActingTenant"}
      - {$ref: "#/components/parameters/ActingBranch"}
      - {$ref: "#/components/parameters/ActingUser"}
    post:
      tags: [Users]
      summary: Assign roles to a user
      operationId: assignUserRoles
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AssignRoleRequest"}
      responses:
        "200":
          description: The updated user.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UserEnvelope"}
        "401": *unauthorized
        "403": *forbidden
        "422": *validationFailed

  /api/v1/user/change-password:
    parameters:
      - {$ref: "#/components/parameters/ActingTenant"}
      - {$ref: "#/components/parameters/ActingBranch"}
      - {$ref: "#/components/parameters/ActingUser"}
    post:
      tags: [Users]
      summary: Set another user's password (admin)
      operationId: changeUserPassword
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ChangePasswordRequest"}
      responses:
        "200":
          description: Password changed.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MessageEnvelope"}
        "401": *unauthorized
        "403": *forbidden
        "422": *validationFailed

  /api/v1/user/{id}/invitation:
    parameters:
      - {$ref: "#/components/parameters/ActingTenant"}
      - {$ref: "#/components/parameters/ActingBranch"}
      - {$ref: "#/components/parameters/ActingUser"}
      - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
    post:
      tags: [Users]
      summary: Send an invitation again
      description: |
        A new link (the previous one stops working), for a user who has not accepted and has never
        signed in; a user who joined answers 409. Needs `user.update`.
      operationId: resendUserInvitation
      responses:
        "200":
          description: Sent.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MessageEnvelope"}
        "401": *unauthorized
        "403": *forbidden
        "404": *notFound
        "409": *conflict

  /api/v1/internal/user/{id}/invitation:
    parameters:
      - {$ref: "#/components/parameters/ActingTenant"}
      - {$ref: "#/components/parameters/ActingBranch"}
      - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
    post:
      tags: [Users]
      summary: Send an internal user's invitation again
      description: The internal twin of `POST /api/v1/user/{id}/invitation`. Needs `user.internal.update`.
      operationId: resendInternalUserInvitation
      responses:
        "200":
          description: Sent.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MessageEnvelope"}
        "401": *unauthorized
        "403": *forbidden
        "404": *notFound
        "409": *conflict

  /api/v1/user/{id}/two-factor:
    parameters:
      - {$ref: "#/components/parameters/ActingTenant"}
      - {$ref: "#/components/parameters/ActingBranch"}
      - {$ref: "#/components/parameters/ActingUser"}
      - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
    delete:
      tags: [Users]
      summary: Reset a user's two-factor authentication (admin)
      description: |
        For a user who lost their phone or mailbox and their recovery codes. Needs
        `user.two_factor.reset`; the user is mailed, and the reset is a `user.two_factor_reset`
        activity row.
      operationId: resetUserTwoFactor
      responses:
        "204": {description: Two-factor is off for the user.}
        "401": *unauthorized
        "403": *forbidden
        "404": *notFound
        "409": *conflict

  /api/v1/user/privacy/deletion:
    get:
      tags: [Privacy]
      summary: The caller's scheduled account deletion
      operationId: getOwnDeletion
      responses:
        "200":
          description: The scheduled (or running) deletion.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: "#/components/schemas/PrivacyRequest"}
        "401": *unauthorized
        "404": *notFound
    post:
      tags: [Privacy]
      summary: Ask for the caller's account to be deleted
      description: |
        Needs the caller's password. Schedules the erasure after the grace period
        (`privacy.deletion_grace_days`, default 14), signs every session and MCP connection
        out and mails the date. The account can still sign in and cancel until then. Asking
        again returns the scheduled request. The super admin (403) and a tenant's last active
        Admin (409, `meta.reasons`) are refused.
      operationId: requestOwnDeletion
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PasswordConfirmation"}
      responses:
        "202":
          description: The deletion is scheduled.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: "#/components/schemas/PrivacyRequest"}
        "401": *unauthorized
        "403": *forbidden
        "409": *conflict
        "422": *validationFailed
        "429": *tooManyRequests
    delete:
      tags: [Privacy]
      summary: Cancel the caller's scheduled account deletion
      description: Only a deletion the caller asked for; one an admin scheduled answers 403 (the admin cancels it).
      operationId: cancelOwnDeletion
      responses:
        "200":
          description: The deletion is cancelled.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: "#/components/schemas/PrivacyRequest"}
        "401": *unauthorized
        "403": *forbidden
        "404": *notFound
        "409": *conflict

  /api/v1/user/privacy/export:
    post:
      tags: [Privacy]
      summary: Export the caller's personal data
      description: |
        Needs the caller's password. Queues a zip (one JSON file per module, the caller's
        files, `manifest.json`; never passwords, tokens or two-factor secrets) and mails the
        link when it is ready. Poll `GET /api/v1/data-processing/job/{jobId}` and download it
        from `/api/v1/data-processing/job/{jobId}/download` (only the caller can). Once a day;
        the file is deleted after `privacy.export_ttl_hours` (default 72).
      operationId: exportOwnData
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PasswordConfirmation"}
      responses:
        "202":
          description: The export is queued.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: "#/components/schemas/PrivacyExportJob"}
        "401": *unauthorized
        "409": *conflict
        "422": *validationFailed
        "429": *tooManyRequests
        "503": *serviceUnavailable

  /api/v1/user/{id}/erase:
    parameters:
      - {$ref: "#/components/parameters/ActingTenant"}
      - {$ref: "#/components/parameters/ActingBranch"}
      - {$ref: "#/components/parameters/ActingUser"}
      - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
    post:
      tags: [Privacy]
      summary: Erase a user of the tenant (admin)
      description: |
        Needs `user.erase`. Schedules the erasure after the grace period and mails the user;
        `immediate: true` erases now (200). The caller cannot erase themself here (use
        `POST /api/v1/user/privacy/deletion`); the super admin and the tenant's last active
        Admin are refused.
      operationId: eraseUser
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: "#/components/schemas/EraseUserRequest"}
      responses:
        "200":
          description: The user is erased.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: "#/components/schemas/PrivacyRequest"}
        "202":
          description: The erasure is scheduled.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: "#/components/schemas/PrivacyRequest"}
        "401": *unauthorized
        "403": *forbidden
        "404": *notFound
        "409": *conflict
        "422": *validationFailed
    delete:
      tags: [Privacy]
      summary: Cancel a user's scheduled erasure (admin)
      description: |
        Needs `user.erase`. Cancels the user's scheduled erasure, whoever asked for it. A user
        can cancel only the deletion they asked for themself; one an admin scheduled is cancelled
        here.
      operationId: cancelUserErasure
      responses:
        "200":
          description: The erasure is cancelled.
