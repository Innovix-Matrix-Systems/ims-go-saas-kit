  /api/v1/webhook:
    parameters:
      - {$ref: "#/components/parameters/ActingTenant"}
      - {$ref: "#/components/parameters/ActingBranch"}
      - {$ref: "#/components/parameters/ActingUser"}
    get:
      tags: [Webhooks]
      summary: The tenant's webhook endpoints
      operationId: listWebhookEndpoints
      responses:
        "200":
          description: The endpoints.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {type: array, items: {$ref: "#/components/schemas/WebhookEndpoint"}}
        "401": *unauthorized
        "403": *forbidden
    post:
      tags: [Webhooks]
      summary: Subscribe a URL to events
      description: |
        Returns the signing secret (`whsec_…`) this once. Events are POSTed signed with
        Standard Webhooks headers (`webhook-id`, `webhook-timestamp`, `webhook-signature`), retried
        with backoff for about a day, and the endpoint is disabled after repeated failures. Needs
        `webhook.manage` and the plan's `api.access`.
      operationId: createWebhookEndpoint
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/WebhookEndpointCreateRequest"}
      responses:
        "201":
          description: The endpoint and its secret.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: "#/components/schemas/WebhookEndpointWithSecret"}
        "401": *unauthorized
        "402": *paymentRequired
        "403": *forbidden
        "422": *validationFailed

