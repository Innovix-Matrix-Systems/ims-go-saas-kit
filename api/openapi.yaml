      required: [total, processed, success, failed, errors]
      properties:
        total: {type: integer}
        processed: {type: integer}
        success: {type: integer}
        failed: {type: integer}
        errors:
          type: array
          items:
            type: object
            additionalProperties: true

    Branch:
      type: object
      required: [id, tenant_id, name, created_at, updated_at]
      properties:
        id: {type: integer, format: int64}
        tenant_id: {type: integer, format: int64}
        name: {type: string}
        address: {type: string, nullable: true}
        description: {type: string, nullable: true}
        phone: {type: string, nullable: true}
        email: {type: string, nullable: true}
        manager_id: {type: integer, format: int64, nullable: true}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    BranchUpsertRequest:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 2, maxLength: 255}
        address: {type: string, maxLength: 255, nullable: true}
        description: {type: string, maxLength: 1000, nullable: true}
        phone: {type: string, maxLength: 50, nullable: true}
        email: {type: string, format: email, maxLength: 255, nullable: true}
        manager_id: {type: integer, format: int64, nullable: true}
      example:
        name: Downtown Branch
        address: 12 Gulshan Ave, Dhaka
        phone: "+8801700000000"
        email: downtown@acme.test

    BranchEnvelope:
      type: object
      required: [data]
      properties:
        data: {$ref: "#/components/schemas/Branch"}

    ActivityEntry:
      type: object
      required: [id, tenant_id, actor, by_staff, impersonator, action, subject_type, subject_id, changes, ip, request_id, created_at]
      properties:
        id: {type: integer, format: int64}
        tenant_id: {type: integer, format: int64, nullable: true, description: Null for system audit log entries.}
        actor:
          type: object
          nullable: true
          required: [id, name]
          properties:
            id: {type: integer, format: int64}
            name: {type: string}
        by_staff: {type: boolean, description: True when staff did this while acting as the actor.}
        impersonator:
          type: object
          nullable: true
          description: Who acted as the actor. Null unless the reader holds `activity.view.all`.
          required: [id, name]
          properties:
            id: {type: integer, format: int64, description: 0 when that account was deleted.}
            name: {type: string}
        action: {type: string, example: user.created}
        subject_type: {type: string, example: user}
        subject_id: {type: integer, format: int64, nullable: true}
        changes: {type: object, additionalProperties: true}
        ip: {type: string, nullable: true}
        request_id: {type: string, nullable: true}
        created_at: {type: string, format: date-time}

    ActivityFacets:
      type: object
      required: [actions, subjects, actors, last_day]
      properties:
        actions:
          type: array
          items: {$ref: "#/components/schemas/ActivityFacetCount"}
        subjects:
          type: array
          items: {$ref: "#/components/schemas/ActivityFacetCount"}
        actors:
          type: array
          items:
            type: object
            required: [id, name, total]
            properties:
              id: {type: integer, format: int64}
              name: {type: string}
              total: {type: integer, format: int64}
        last_day: {type: integer, format: int64, description: Entries in the last 24 hours.}

    ActivityFacetCount:
      type: object
      required: [value, total]
      properties:
        value: {type: string}
        total: {type: integer, format: int64}

    ActivityFeedEnvelope:
      type: object
      required: [data, links, meta]
      properties:
        data:
          type: array
          items: {$ref: "#/components/schemas/ActivityEntry"}
        links:
          type: object
          required: [next]
          properties:
            next: {type: string, nullable: true}
        meta:
          type: object
          required: [path, per_page, next_cursor, total]
          properties:
            path: {type: string}
            per_page: {type: integer}
            next_cursor: {type: string, nullable: true}
            total: {type: integer, format: int64, description: "Entries matching the filters, across every page."}

    BranchPageEnvelope:
      type: object
      required: [data, links, meta]
      properties:
        data:
          type: array
          items: {$ref: "#/components/schemas/Branch"}
        links: {$ref: "#/components/schemas/PaginationLinks"}
        meta: {$ref: "#/components/schemas/PaginationMeta"}

    Role:
      type: object
      required: [id, name, is_system, managed, created_at, updated_at]
      properties:
        id: {type: integer, format: int64}
        name: {type: string}
        is_system: {type: boolean}
        managed:
          type: boolean
          description: The organization's Admin role. The app keeps it holding every organization permission, so it cannot be renamed, deleted or given other permissions.
        description: {type: string, nullable: true}
        tenant_id: {type: integer, format: int64, nullable: true}
        tenant: {$ref: "#/components/schemas/TenantSlim"}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        permissions:
          type: array
          description: The role's permissions; on the single-role read only.
          items: {$ref: "#/components/schemas/Permission"}

    RoleUpsertRequest:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 2, maxLength: 100}
        description: {type: string, maxLength: 255, nullable: true}
      example:
        name: Support
        description: Read-only support role

    RoleInternalRequest:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 2, maxLength: 100}
        description: {type: string, maxLength: 255, nullable: true}
        tenant_id: {type: integer, format: int64, nullable: true}
        is_system: {type: boolean}
      example:
        name: Support
        description: Read-only support role
        tenant_id: 1
        is_system: false

    RolePermissionAssignRequest:
      type: object
      required: [id]
      properties:
        id: {type: integer, format: int64}
        permissions:
          type: array
          items: {type: integer, format: int64}
      example:
        id: 3
        permissions: [1, 2, 3]

    RoleEnvelope:
      type: object
      required: [data]
      properties:
        data: {$ref: "#/components/schemas/Role"}

    RoleArrayEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: {$ref: "#/components/schemas/Role"}

    Permission:
      type: object
      required: [id, name, group, guard, is_system]
      properties:
        id: {type: integer, format: int64}
        name: {type: string}
        group: {type: string}
        guard: {type: string}
        description: {type: string, nullable: true}
        is_system: {type: boolean}

    PermissionInsertRequest:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 2, maxLength: 150}
        group: {type: string, maxLength: 100}
        description: {type: string, maxLength: 255, nullable: true}
      example:
        name: report.view
        group: report
        description: Can view reports

    PermissionEnvelope:
      type: object
      required: [data]
      properties:
        data: {$ref: "#/components/schemas/Permission"}

    PermissionArrayEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: {$ref: "#/components/schemas/Permission"}

    Tenant:
      type: object
      required: [id, name, code, is_active, created_at, updated_at]
      properties:
        id: {type: integer, format: int64}
        name: {type: string}
        code: {type: string}
        slug: {type: string, nullable: true}
        domain: {type: string, nullable: true}
        phone: {type: string, nullable: true}
        email: {type: string, nullable: true}
        is_active: {type: boolean}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    TenantUpsertRequest:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 2, maxLength: 255}
        slug: {type: string, maxLength: 255, nullable: true}
        domain: {type: string, maxLength: 255, nullable: true}
        phone: {type: string, maxLength: 50, nullable: true}
        email: {type: string, format: email, maxLength: 255, nullable: true}
        is_active: {type: boolean, nullable: true}
      example:
        name: Acme Corp
        slug: acme-corp
        domain: acme.example.com
        email: hello@acme.test
        is_active: true

    TenantEnvelope:
      type: object
      required: [data]
      properties:
        data: {$ref: "#/components/schemas/Tenant"}

    TenantPageEnvelope:
      type: object
      required: [data, links, meta]
      properties:
        data:
          type: array
          items: {$ref: "#/components/schemas/Tenant"}
        links: {$ref: "#/components/schemas/PaginationLinks"}
        meta: {$ref: "#/components/schemas/PaginationMeta"}

    Feature:
      type: object
      required: [feature_key, is_enabled, limit_value]
      properties:
        feature_key: {type: string}
        is_enabled: {type: boolean}
        limit_value: {type: integer, format: int64}

    Package:
      type: object
      required: [id, name, price, billing_cycle, trial_days, is_active, sort_order, features, created_at, updated_at]
      properties:
        id: {type: integer, format: int64}
        name: {type: string}
        description: {type: string, nullable: true}
        price: {type: integer, format: int64, description: Minor units (paisa).}
        billing_cycle: {type: string, enum: [monthly, yearly, one_time]}
        trial_days: {type: integer}
        is_active: {type: boolean}
        sort_order: {type: integer}
        features:
          type: array
          items: {$ref: "#/components/schemas/Feature"}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    FeatureRequest:
      type: object
      required: [feature_key]
      properties:
        feature_key: {type: string}
        is_enabled: {type: boolean}
        limit_value: {type: integer, format: int64, minimum: -1}
      example:
        feature_key: users.max
        is_enabled: true
        limit_value: 25

    PackageInsertRequest:
      type: object
      required: [name, price, billing_cycle]
      properties:
        name: {type: string, minLength: 2, maxLength: 150}
        description: {type: string, maxLength: 500, nullable: true}
        price: {type: integer, format: int64, minimum: 0}
        billing_cycle: {type: string, enum: [monthly, yearly, one_time]}
        trial_days: {type: integer, minimum: 0}
        is_active: {type: boolean, nullable: true}
        sort_order: {type: integer}
        features:
          type: array
          items: {$ref: "#/components/schemas/FeatureRequest"}
      example:
        name: Starter
        description: For small teams
        price: 9900
        billing_cycle: monthly
        trial_days: 14
        is_active: true
        sort_order: 1
        features:
          - {feature_key: users.max, is_enabled: true, limit_value: 10}
          - {feature_key: branches.max, is_enabled: true, limit_value: 3}

    PackageEnvelope:
      type: object
      required: [data]
      properties:
        data: {$ref: "#/components/schemas/Package"}

    PackageArrayEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: {$ref: "#/components/schemas/Package"}

    Subscription:
      type: object
      required: [id, tenant_id, package_id, status, created_at, updated_at]
      properties:
        id: {type: integer, format: int64}
        tenant_id: {type: integer, format: int64}
        package_id: {type: integer, format: int64}
        status: {type: string, enum: [trial, pending, active, past_due, cancelled, expired]}
        starts_at: {type: string, format: date-time, nullable: true}
        trial_ends_at: {type: string, format: date-time, nullable: true}
        expires_at: {type: string, format: date-time, nullable: true}
        cancelled_at: {type: string, format: date-time, nullable: true}
        cancellation_reason: {type: string, nullable: true}
        overrides:
          type: object
          additionalProperties: true
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    SubscriptionEnvelope:
      type: object
      required: [data]
      properties:
        data: {$ref: "#/components/schemas/Subscription"}

    SubscriptionPageEnvelope:
      type: object
      required: [data, links, meta]
      properties:
        data:
          type: array
          items: {$ref: "#/components/schemas/Subscription"}
        links: {$ref: "#/components/schemas/PaginationLinks"}
        meta: {$ref: "#/components/schemas/PaginationMeta"}

    SubscriptionStatusEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [active]
          properties:
            subscription: {$ref: "#/components/schemas/Subscription"}
            package: {$ref: "#/components/schemas/Package"}
            active: {type: boolean}

    BillingUsage:
      type: object
      required: [limits, storage_bytes]
      properties:
        limits:
          type: array
          items:
            type: object
            required: [feature_key, description, limit, used]
            properties:
              feature_key: {type: string, example: users.max}
              description: {type: string}
              limit: {type: integer, format: int64, description: "-1 unlimited, 0 not in the plan."}
              used: {type: integer, format: int64}
        storage_bytes: {type: integer, format: int64}

    SubscribeRequest:
      type: object
      required: [package_id]
      properties:
        package_id: {type: integer, format: int64}
        payment_method: {type: string, enum: [bkash, nagad, cash, bank_transfer], description: "Required for a paid package. A free package starts at once, with no payment."}
        payment_data:
          type: object
          additionalProperties: true
      example:
        package_id: 1
        payment_method: cash
        payment_data: {notes: paid in cash}

    SubscribeEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [subscription, payment]
          properties:
            subscription: {$ref: "#/components/schemas/Subscription"}
            payment:
              allOf: [{$ref: "#/components/schemas/Payment"}]
              nullable: true
              description: Null for a free package, which starts at once.

    AssignPlanRequest:
      type: object
      required: [package_id]
      properties:
        package_id: {type: integer, format: int64, minimum: 1}
        payment_method: {type: string, enum: [cash, bank_transfer]}
        amount:
          type: integer
          format: int64
          minimum: 1
          description: Defaults to the package price. Requires payment_method.
      example:
        package_id: 2
        payment_method: cash
        amount: 1500

    AssignPlanEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [subscription, payment]
          properties:
            subscription: {$ref: "#/components/schemas/Subscription"}
            payment:
              allOf: [{$ref: "#/components/schemas/Payment"}]
              nullable: true

    Payment:
      type: object
      required: [id, tenant_id, payment_method, status, amount, currency, invoice_number, created_at, updated_at]
      properties:
        id: {type: integer, format: int64}
        tenant_id: {type: integer, format: int64}
        subscription_id: {type: integer, format: int64, nullable: true}
        payment_method: {type: string, enum: [bkash, nagad, cash, bank_transfer]}
        status: {type: string, enum: [pending, processing, completed, failed, cancelled, awaiting_approval]}
        amount: {type: integer, format: int64, description: Minor units (paisa).}
        currency: {type: string, example: BDT}
        gateway_ref: {type: string, nullable: true}
        gateway_status: {type: string, nullable: true}
        gateway_response:
          type: object
          additionalProperties: true
        invoice_number: {type: string}
        paid_at: {type: string, format: date-time, nullable: true}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    PaymentEnvelope:
      type: object
      required: [data]
      properties:
        data: {$ref: "#/components/schemas/Payment"}

    PaymentPageEnvelope:
      type: object
      required: [data, links, meta]
      properties:
        data:
          type: array
          items: {$ref: "#/components/schemas/Payment"}
        links: {$ref: "#/components/schemas/PaginationLinks"}
        meta: {$ref: "#/components/schemas/PaginationMeta"}

    RecordPaymentRequest:
      type: object
      required: [tenant_id, subscription_id, payment_method, amount]
      properties:
        tenant_id: {type: integer, format: int64}
        subscription_id: {type: integer, format: int64}
        payment_method: {type: string, enum: [cash, bank_transfer]}
        amount: {type: integer, format: int64, minimum: 0}
        notes: {type: string, maxLength: 500, nullable: true}
      example:
        tenant_id: 1
        subscription_id: 1
        payment_method: cash
        amount: 9900
        notes: collected at the front desk

    ReviewRequest:
      type: object
      properties:
        note: {type: string, maxLength: 500, nullable: true}
      example:
        note: verified the bank slip

    Approval:
      type: object
      required: [id, tenant_id, subscription_id, payment_id, payment_method, status, created_at, updated_at]
      properties:
        id: {type: integer, format: int64}
        tenant_id: {type: integer, format: int64}
        subscription_id: {type: integer, format: int64}
        payment_id: {type: integer, format: int64}
        payment_method: {type: string, enum: [bkash, nagad, cash, bank_transfer]}
        payment_data:
          type: object
          additionalProperties: true
        status: {type: string, enum: [pending, approved, rejected]}
        reviewer_id: {type: integer, format: int64, nullable: true}
        reviewer_note: {type: string, nullable: true}
        reviewed_at: {type: string, format: date-time, nullable: true}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        details:
          type: object
          description: In lists only. Who pays, how much and for which plan.
          required: [tenant_name, package_name, amount, currency, invoice_number]
          properties:
            tenant_name: {type: string}
            package_name: {type: string}
            amount: {type: integer, format: int64, description: Minor units (paisa).}
            currency: {type: string}
            invoice_number: {type: string}

    ApprovalEnvelope:
      type: object
      required: [data]
      properties:
        data: {$ref: "#/components/schemas/Approval"}

    ApprovalPageEnvelope:
      type: object
      required: [data, links, meta]
      properties:
        data:
          type: array
          items: {$ref: "#/components/schemas/Approval"}
        links: {$ref: "#/components/schemas/PaginationLinks"}
        meta: {$ref: "#/components/schemas/PaginationMeta"}

    NotificationTarget:
      type: object
      required: [id, target_type]
      properties:
        id: {type: integer, format: int64}
        target_type: {type: string, enum: [USER, ROLE, BRANCH, TENANT, GLOBAL]}
        target_id: {type: integer, format: int64, nullable: true}

    Notification:
      type: object
      required: [id, event_type, priority, title, created_at, updated_at, targets]
      properties:
        id: {type: integer, format: int64}
        tenant_id: {type: integer, format: int64, nullable: true}
        event_type: {type: string}
        priority: {type: string, enum: [INFO, WARNING, CRITICAL]}
        title: {type: string}
        body: {type: string, nullable: true}
        data: {}
        group_key: {type: string, nullable: true}
        created_by: {type: integer, format: int64, nullable: true}
        updated_by: {type: integer, format: int64, nullable: true}
        expires_at: {type: string, format: date-time, nullable: true}
        channels:
          type: array
          description: "`database` (the in-app feed, always) plus any of `mail`, `sms`, `push`."
          items: {type: string, enum: [database, mail, sms, push]}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        targets:
          type: array
          items: {$ref: "#/components/schemas/NotificationTarget"}

    WebhookEvent:
      type: object
      required: [type, description]
      properties:
        type: {type: string, example: user.created}
        description: {type: string}

    WebhookEndpoint:
      type: object
      required: [id, url, description, events, is_active, consecutive_failures, disabled_reason, created_at, updated_at]
      properties:
        id: {type: integer, format: int64}
        url: {type: string}
        description: {type: string}
        events:
          type: array
          items: {type: string, example: user.created}
          description: Event types, or `*` for every event.
        is_active: {type: boolean}
        consecutive_failures: {type: integer, description: Abandoned deliveries in a row.}
        disabled_reason: {type: string, nullable: true}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    WebhookEndpointWithSecret:
      allOf:
        - {$ref: "#/components/schemas/WebhookEndpoint"}
        - type: object
          required: [secret]
          properties:
            secret: {type: string, example: "whsec_MfKQ9r8GKYqrTwjUPD8ILPZIo2LaLaSw", description: Shown once.}

    WebhookEndpointCreateRequest:
      type: object
      required: [url, events]
      properties:
        url: {type: string, maxLength: 2000, description: "https (http and private addresses only with WEBHOOK_ALLOW_PRIVATE)."}
        description: {type: string, maxLength: 255}
        events:
          type: array
          minItems: 1
          maxItems: 100
          items: {type: string}

    WebhookEndpointUpdateRequest:
      type: object
      properties:
        url: {type: string, maxLength: 2000}
        description: {type: string, maxLength: 255}
        events:
          type: array
          minItems: 1
          maxItems: 100
          items: {type: string}
        is_active: {type: boolean}

    WebhookDelivery:
      type: object
      required: [id, endpoint_id, event_id, event_type, payload, status, attempts, created_at]
      properties:
        id: {type: integer, format: int64}
        endpoint_id: {type: integer, format: int64}
        event_id: {type: string, example: evt_9f2c1a7b4e6d4f0a8c3b2d1e0f9a8b7c}
        event_type: {type: string}
        payload: {type: object, additionalProperties: true, description: The JSON body that was sent.}
        status: {type: string, enum: [pending, succeeded, abandoned]}
        attempts: {type: integer}
        response_status: {type: integer, nullable: true}
        response_body: {type: string, nullable: true, description: The first 4 KB of the answer.}
        duration_ms: {type: integer, nullable: true}
        error: {type: string, nullable: true}
        next_attempt_at: {type: string, format: date-time, nullable: true}
        created_at: {type: string, format: date-time}
        delivered_at: {type: string, format: date-time, nullable: true}

    NotificationPreference:
      type: object
      required: [event_type, description, channel, enabled, mandatory]
      properties:
        event_type: {type: string, example: renewal.reminder}
        description: {type: string}
        channel: {type: string, enum: [mail, sms, push]}
