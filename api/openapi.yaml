      - {$ref: "#/components/parameters/ActingBranch"}
      - {$ref: "#/components/parameters/ActingUser"}
      - {name: id, in: path, required: true, schema: {type: integer, format: int64}}
    get:
      tags: [Webhooks]
      summary: An endpoint's delivery log
      operationId: listWebhookDeliveries
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [pending, succeeded, abandoned]}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
        - {name: cursor, in: query, description: Last seen delivery id (exclusive)., schema: {type: string}}
      responses:
        "200":
          description: Newest first.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {type: array, items: {$ref: "#/components/schemas/WebhookDelivery"}}
                  links: {type: object, nullable: true}
                  meta: {type: object, properties: {next_cursor: {type: string}}}
        "401": *unauthorized
        "403": *forbidden
        "404": *notFound

