    post:
      tags: [Dev]
      summary: Run a scheduled task now (dev.manage)
      description: >-
        The same work as `ims schedule:run`. The run continues in the background (its own timeout
        applies); its outcome becomes the task's last run, and it is audited as `schedule.run`.
        Refused (409) while the task is still running, here or in the `ims schedule` process.
      operationId: devRunScheduledTask
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "202":
          description: The run started.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [task, started_at]
                    properties:
                      task: {type: string}
                      started_at: {type: string, format: date-time}
