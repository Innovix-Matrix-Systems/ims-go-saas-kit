    get:
      tags: [Dev]
      summary: Maintenance mode state
      description: Whether the API is down for maintenance (`ims down`), since when and with which message. Read from the database, not the per-process cache.
      operationId: devMaintenanceStatus
      responses:
        "200":
          description: The state.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DevMaintenanceEnvelope"}
        "401": *unauthorized
        "403": *forbidden
        "404": *notFound

  /dev/api/maintenance/down:
    post:
      tags: [Dev]
      summary: Take the API down for maintenance
      description: |
        Every API process answers `503 MAINTENANCE_MODE` (with `Retry-After`) within
        `MAINTENANCE_CHECK_INTERVAL`; `/up`, `/api/health`, `/metrics`, `/dev` and `/docs` keep
        working. With `with_secret`, the response carries a bypass secret once: a client sending
        it in `X-Maintenance-Bypass` passes. Calling it while down updates the message, retry and
        secret. Needs `dev.manage`; audited (`maintenance.down`).
      operationId: devMaintenanceDown
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DevMaintenanceDownRequest"}
      responses:
        "200":
          description: The new state (and the bypass secret, once).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DevMaintenanceEnvelope"}
        "401": *unauthorized
        "403": *forbidden
        "404": *notFound
        "422": *validationFailed

  /dev/api/maintenance/up:
    post:
      tags: [Dev]
      summary: Bring the API back from maintenance
      description: Needs `dev.manage`; audited (`maintenance.up`). Answers 200 when the API was not down too.
      operationId: devMaintenanceUp
      responses:
        "200":
          description: The new (up) state.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DevMaintenanceEnvelope"}
