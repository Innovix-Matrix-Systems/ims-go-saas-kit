        "401": *unauthorized
        "403": *forbidden
        "404": *notFound
    patch:
      tags: [Webhooks]
      summary: Change a webhook endpoint
      description: Absent fields keep their value. Turning a disabled endpoint back on resets its failure count.
      operationId: updateWebhookEndpoint
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/WebhookEndpointUpdateRequest"}
      responses:
        "200":
          description: The endpoint.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: "#/components/schemas/WebhookEndpoint"}
        "401": *unauthorized
        "403": *forbidden
        "404": *notFound
        "422": *validationFailed
    delete:
      tags: [Webhooks]
      summary: Delete a webhook endpoint and its delivery log
      operationId: deleteWebhookEndpoint
      responses:
        "204": {description: Deleted.}
        "401": *unauthorized
        "403": *forbidden
        "404": *notFound

