<h2 style="margin:0 0 12px;font-size:18px;">{{.Data.title}}</h2>
{{if .Data.body}}<p style="white-space:pre-line;">{{.Data.body}}</p>{{end}}
{{if .Data.url}}<p style="margin:24px 0;"><a href="{{.Data.url}}" style="background:{{.Brand.Color}};color:#ffffff;text-decoration:none;padding:12px 20px;border-radius:6px;display:inline-block;">Ouvrir</a></p>{{end}}
{{if .Data.unsubscribe}}<p style="font-size:12px;color:#6b7785;">Vous recevez cet e-mail en raison de vos préférences de notification. <a href="{{.Data.unsubscribe}}">Ne plus recevoir ces e-mails</a>.</p>{{end}}
