<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Subject}}</title>
</head>
<body style="margin:0;padding:0;background:#f4f5f7;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1f2933;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f5f7;padding:24px 12px;">
<tr><td align="center">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border-radius:8px;overflow:hidden;">
<tr><td style="padding:20px 28px;border-bottom:3px solid {{.Brand.Color}};">
{{if .Brand.LogoURL}}<img src="{{.Brand.LogoURL}}" alt="{{.Brand.Name}}" height="32" style="display:block;border:0;height:32px;">{{else}}<strong style="font-size:18px;color:{{.Brand.Color}};">{{.Brand.Name}}</strong>{{end}}
</td></tr>
<tr><td style="padding:28px;font-size:15px;line-height:1.6;">
{{.Body}}
</td></tr>
<tr><td style="padding:16px 28px;background:#fafbfc;font-size:12px;line-height:1.5;color:#6b7785;">
{{if .Brand.Footer}}{{.Brand.Footer}}{{else}}&copy; {{.Brand.Name}}{{end}}
</td></tr>
</table>
</td></tr>
</table>
</body>
</html>
