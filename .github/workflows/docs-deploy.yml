name: Docs deploy

# Publishes the documentation site (docsite/, content in docs/) to Cloudflare
# Workers as static assets. Runs when a GitHub Release is published, or by
# hand from the Actions tab (e.g. after a docs-only fix).
#
# One-time setup — repository secrets:
#   CLOUDFLARE_API_TOKEN   (template "Edit Cloudflare Workers")
#   CLOUDFLARE_ACCOUNT_ID
# The public address is https://ims-go-saas-kit.innovixmatrixsystem.com (a Custom Domain on the
# Worker, set in the Cloudflare dashboard). A fork publishing elsewhere sets the
# repository variable DOCS_SITE_URL.

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: docs-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: docs
      url: ${{ vars.DOCS_SITE_URL || 'https://ims-go-saas-kit.innovixmatrixsystem.com' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: docsite/package-lock.json

      - name: install
        run: npm ci
        working-directory: docsite

      - name: build and check every link
        run: npm run build
        working-directory: docsite
        env:
          DOCS_SITE_URL: ${{ vars.DOCS_SITE_URL }}

      - name: deploy to Cloudflare
        run: npx wrangler deploy
        working-directory: docsite
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
